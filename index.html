
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Tahreem Rehman</title>
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; visibility: hidden; }</style>
      <script>
        // Decodes the path encoded by 404.html's redirect and restores the real
        // URL via history.replaceState before React Router mounts, so a direct
        // load of e.g. /portfolio ends up rendering that route instead of "/".
        (function (l) {
          if (l.search[1] === "/") {
            var decoded = l.search
              .slice(1)
              .split("&")
              .map(function (s) { return s.replace(/~and~/g, "&"); })
              .join("?");
            window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
          }
        })(window.location);
      </script>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
