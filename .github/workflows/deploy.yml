name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          VITE_ARENA_TOKEN: ${{ secrets.VITE_ARENA_TOKEN }}
          # Supabase powers visitor image uploads. The anon key is meant to be public
          # (it ships in the client bundle); access is gated by Storage RLS policies.
          VITE_SUPABASE_URL: https://cqhotvhsuksjhjajbqlh.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNxaG90dmhzdWtzamhqYWpicWxoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyMDUwOTQsImV4cCI6MjA5OTc4MTA5NH0.8JtKJLbPGInGZLax0-eDuAkWUwVJtXnnFl370nYdqxY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
